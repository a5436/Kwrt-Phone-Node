name: Build TK CrossBorder AX6000

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      TARGET: mediatek_filogic
    steps:
      - name: Checkout custom files
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
          sudo apt-get -qq clean

      - name: Clone OpenWrt 25.12
        run: git clone --depth 1 --branch openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt

      - name: Apply Kwrt and TK CrossBorder customization
        shell: bash
        run: |
          set -e
          function git_clone_path() {
            local branch="$1" rurl="$2" mv_mode="$3"
            if [[ "$mv_mode" != "mv" ]]; then shift 2; else shift 3; fi
            local rootdir="$PWD" tmpdir
            tmpdir="$(mktemp -d)"
            git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
            cd "$tmpdir"
            git sparse-checkout set "$@"
            if [[ "$mv_mode" != "mv" ]]; then cp -rn ./* "$rootdir/"; else mv -n "$@"/* "$rootdir/$@/"; fi
            cd "$rootdir"
            rm -rf "$tmpdir"
          }
          export -f git_clone_path
          cp -rf devices/common/. openwrt/
          cp -rf devices/${TARGET}/. openwrt/
          cp -rf devices openwrt/
          cd openwrt
          sed -i '1a REPO_TOKEN=' devices/common/diy.sh
          bash devices/common/diy.sh
          cp -f devices/common/.config .config
          printf '\n' >> .config
          cat devices/${TARGET}/.config >> .config
          bash devices/${TARGET}/diy.sh
          cp -Rf ./diy/* ./ 2>/dev/null || true
          cp -rn devices/common/patches devices/${TARGET}/ 2>/dev/null || true
          find "devices/${TARGET}/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 2>/dev/null | sort -z | xargs -0 -r -n 1 sh -c 'patch -d . -R --no-backup-if-mismatch -p1 -F 1 -i "$0"'
          find "devices/${TARGET}/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 2>/dev/null | sort -z | xargs -0 -r -n 1 sh -c 'patch -d . --no-backup-if-mismatch -p1 -F 1 -i "$0"'

      - name: Resolve configuration
        working-directory: openwrt
        run: |
          make defconfig
          grep -E 'CONFIG_TARGET_DEVICE.*ax6000|CONFIG_PACKAGE_(luci-app-passwall|xray-core)|CONFIG_TARGET_ROOTFS_INITRAMFS' .config

      - name: Download packages
        working-directory: openwrt
        run: make download -j8

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Name TK CrossBorder images
        run: |
          mkdir -p output
          find openwrt/bin/targets/mediatek/filogic -maxdepth 1 -type f \( -name '*redmi-router-ax6000*' -o -name 'sha256sums' -o -name '*.manifest' \) -exec cp -v {} output/ \;
          cd output
          for file in *redmi-router-ax6000*; do
            [ -e "$file" ] || continue
            mv "$file" "${file/openwrt-mediatek-filogic-xiaomi_redmi-router-ax6000-ubootmod/tk-crossborder-redmi-ax6000}"
          done
          sha256sum * > TK-CrossBorder-SHA256SUMS.txt

      - name: Upload TK CrossBorder firmware
        uses: actions/upload-artifact@v4
        with:
          name: TK-CrossBorder-Redmi-AX6000
          path: output/
          if-no-files-found: error
          retention-days: 30
